<!doctype html><html><head><meta charset="utf-8"><title>Icon render</title>
<style>body{font:12px sans-serif;margin:12px;background:#fff}.row{display:flex;gap:16px;align-items:center;margin:4px 0}
.dark{background:#3b4453;padding:6px}.light{background:#e8e8e8;padding:6px}img.x4{image-rendering:pixelated}</style></head>
<body><button id="go">Render</button><div id="out"></div>
<script>
// Renders each master: <Name>.svg -> <Name>32.png, <Name>.16.svg -> <Name>16.png; then shows a contact sheet.
async function render(file){
  const text = await (await fetch('/svg/' + encodeURIComponent(file))).text();
  const is16 = file.endsWith('.16.svg'); const size = is16 ? 16 : 32;
  const name = file.replace(/\.16\.svg$|\.svg$/, '') + size + '.png';
  const img = new Image(); img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(text))); await img.decode();
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  c.getContext('2d').drawImage(img, 0, 0, size, size);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  await fetch('/save/' + encodeURIComponent(name), { method: 'POST', body: blob });
  return { name, url: c.toDataURL() };
}
async function run(){
  const files = await (await fetch('/list')).json(); const done = {};
  for (const f of files) { const r = await render(f); done[r.name] = r.url; }
  const bases = [...new Set(Object.keys(done).map(n => n.replace(/(16|32)\.png$/, '')))];
  const out = document.getElementById('out'); out.innerHTML = '';
  for (const b of bases) {
    const u32 = done[b + '32.png'], u16 = done[b + '16.png'];
    const cell = u => u ? `<img src="${u}">` : '';
    out.insertAdjacentHTML('beforeend', `<div class="row"><span style="width:190px">${b}</span>
      <span class="light">${cell(u32)} ${cell(u16)}</span><span class="dark">${cell(u32)} ${cell(u16)}</span>
      <span class="light"><img class="x4" src="${u32 || ''}" width="96" height="96"><img class="x4" src="${u16 || ''}" width="64" height="64"></span></div>`);
  }
  return Object.keys(done).length;
}
document.getElementById('go').onclick = run; window.runAll = run;
</script></body></html>
